<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrello</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR (Identica alla Home) -->
<header class="navbar">
    <div class="nav-brand">
        <h1>WebStore</h1>
    </div>

    <form class="nav-search" action="home.html" method="get">
        <input type="text" id="search-input" name="q" placeholder="Cerca prodotti..." aria-label="Cerca prodotti" required>
        <button type="submit">Cerca</button>
    </form>

    <div class="nav-user">
        <span>Ciao, <strong>Mario Rossi</strong></span>
        <nav class="nav-links">
            <a href="#">Profilo</a>
            <a href="#">I miei ordini</a>
            <a href="carrello.html">Carrello</a>
            <a href="login.html">Esci</a>
        </nav>
    </div>
</header>

<!-- CORPO PRINCIPALE (LISTA ARTICOLI A SINISTRA + SIDEBAR TOTALE A DESTRA) -->
<div class="cart-layout">

    <!-- ELENCO PRODOTTI NEL CARRELLO (POPOLATO DINAMICAMENTE) -->
    <main class="cart-items">
        <h2>Il tuo Carrello</h2>

        <div id="cart-list">
            <!-- Gli elementi .cart-item verranno inseriti da carrello.js -->
        </div>

        <p><a href="home.html">&larr; Continua gli acquisti</a></p>
    </main>

    <!-- SIDEBAR DESTRA: RIEPILOGO E PROCEDI -->
    <aside class="cart-summary">
        <h3>Riepilogo Ordine</h3>
        <div class="summary-row">
            <span>Articoli totali:</span>
            <span id="total-items">0</span>
        </div>
        <div class="summary-row total-row">
            <span>Totale provvisorio:</span>
            <strong>€ <span id="cart-total">0.00</span></strong>
        </div>
        <a href="checkout.html">
            <button type="button" id="btn-checkout" class="btn-checkout">Procedi al Checkout</button>
        </a>
    </aside>

</div>

<!-- FOOTER -->
<footer class="footer">
    <p>&copy; 2026 WebStore S.R.L. - Tutti i diritti riservati.</p>
    <p><small>Disclaimer: Questo sito è una simulazione accademica a scopo didattico.</small></p>
</footer>

<!-- SCRIPT DEDICATO AL CARRELLO -->
<script src="js/carrello.js"></script>
</body>
</html>
